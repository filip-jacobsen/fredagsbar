services:
  api:
    build: .
    command: python api.py
    environment:
      API_HOST: 0.0.0.0
      API_DEBUG: "0"
    ports:
      - "5000:5000"

  frontend:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    environment:
      API_URL: http://api:5000
    ports:
      - "8501:8501"
    depends_on:
      - api